name: Build & test macOS installer (universale Intel+Apple Silicon)

on:
  workflow_dispatch: {}
  push:
    branches: [main]
    paths:
      - "apps/server/**"
      - "apps/web/**"
      - ".github/workflows/build-macos-installer.yml"

jobs:
  build-universal:
    # macos-latest = Apple Silicon (arm64) nativo. Con Rosetta 2 installata può anche
    # eseguire binari x64 (necessaria sia al passaggio di "fabbricazione" di pkg per il
    # target x64, sia per testare quel binario per davvero più sotto) — un solo runner
    # arm64 basta per produrre e verificare entrambe le arch.
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Assicura Rosetta 2 (serve a pkg per fabbricare/eseguire il binario x64 su host arm64)
        run: softwareupdate --install-rosetta --agree-to-license || true

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Installa dipendenze (intero workspace)
        run: npm ci

      - name: Genera client Prisma (tutti i binaryTargets, vedi schema.prisma)
        run: npx prisma generate
        working-directory: apps/server

      - name: Build installer macOS universale (un solo pacchetto, entrambi i binari)
        run: npm run build:installer:macos -w apps/server
        env:
          SKIP_OBFUSCATE: "1" # build CI di verifica: l'offuscamento non cambia se il binario parte o no, solo la velocità

      - name: Verifica che entrambi i binari siano presenti e del tipo giusto
        # NON usiamo più `lipo -create` per unirli in un fat binary: provato e scartato,
        # produce un eseguibile che compila ma crasha all'avvio (offset del payload pkg
        # invalidati dallo spostamento delle sezioni) — vedi docs/installer-macos.md.
        # Un pacchetto con i due binari separati, selezionati a install-time, è più
        # verboso ma realmente funzionante: lo testiamo ENTRAMBI qui sotto per davvero.
        run: |
          cd apps/server/installer-output-macos/nugis-macos-universal
          file Nugis-x64 | tee /tmp/file-x64.txt | grep -q "x86_64"
          file Nugis-arm64 | tee /tmp/file-arm64.txt | grep -q "arm64"

      - name: Test reale (nativo arm64, via install.sh) — installa il LaunchDaemon e interroga /health
        run: |
          set -euo pipefail
          cd apps/server/installer-output-macos/nugis-macos-universal
          sudo NUGIS_ADMIN_EMAIL=ci@nugis.test NUGIS_ADMIN_PASSWORD='ci-test-password-123' ./install.sh
          for i in $(seq 1 15); do
            if curl -fsS http://localhost:4000/health; then echo; break; fi
            echo "in attesa del servizio... ($i/15)"; sleep 2
          done
          curl -fsS http://localhost:4000/health | grep -q '"ok":true'
          echo "✅ /health risponde correttamente (arch nativa arm64, via launchd)"
          sudo /usr/local/nugis/uninstall.sh --purge
          echo "✅ Disinstallazione completata senza errori"

      - name: Diagnostica in caso di fallimento (install.sh)
        if: failure()
        run: |
          echo "--- launchctl print ---"
          sudo launchctl print system/com.nugis.app || true
          echo "--- /usr/local/nugis/nugis.log ---"
          sudo cat /usr/local/nugis/nugis.log || true

      - name: Test reale del binario x64 (via Rosetta, indipendente da install.sh)
        run: |
          set -euo pipefail
          B="apps/server/installer-output-macos/nugis-macos-universal"
          T="$RUNNER_TEMP/nugis-x64-test"
          mkdir -p "$T"
          cp "$B/Nugis-x64" "$T/Nugis"
          cp -r "$B/generated" "$B/prisma" "$B/public" "$T/"
          chmod +x "$T/Nugis"
          cat > "$T/.env" <<EOF
          DATABASE_URL="file:$T/nugis.db"
          ENCRYPTION_KEY="$(openssl rand -base64 48)"
          LLM_PROVIDER="ollama"
          ADMIN_JWT_SECRET="$(openssl rand -base64 48)"
          ADMIN_DEFAULT_EMAIL="ci@nugis.test"
          ADMIN_DEFAULT_PASSWORD="ci-test-password-123"
          PORT=4001
          WEB_ORIGIN="http://localhost:4001"
          EOF
          cd "$T"
          ./Nugis > nugis-x64.log 2>&1 &
          PID=$!
          ok=0
          for i in $(seq 1 20); do
            if curl -fsS http://localhost:4001/health; then ok=1; echo; break; fi
            echo "in attesa del binario x64 (Rosetta)... ($i/20)"; sleep 2
          done
          if [ "$ok" != "1" ]; then
            echo "--- log del binario x64 ---"; cat nugis-x64.log
            kill "$PID" 2>/dev/null || true
            exit 1
          fi
          curl -fsS http://localhost:4001/health | grep -q '"ok":true'
          echo "✅ Il binario x64 (via Rosetta) risponde correttamente — motore Prisma corretto incluso"
          kill "$PID" 2>/dev/null || true

      - name: Test reale (via .pkg) — installer GUI in modalità silenziosa
        run: |
          set -euo pipefail
          sudo installer -pkg apps/server/installer-output-macos/NugisInstaller.pkg -target /
          test -f /usr/local/nugis/CREDENZIALI_INIZIALI.txt
          for i in $(seq 1 15); do
            if curl -fsS http://localhost:4000/health; then echo; break; fi
            echo "in attesa del servizio... ($i/15)"; sleep 2
          done
          curl -fsS http://localhost:4000/health | grep -q '"ok":true'
          echo "✅ .pkg installa e avvia correttamente (credenziali casuali in CREDENZIALI_INIZIALI.txt)"
          sudo /usr/local/nugis/uninstall.sh --purge

      - name: Diagnostica in caso di fallimento (.pkg)
        if: failure()
        run: |
          echo "--- launchctl print ---"
          sudo launchctl print system/com.nugis.app || true
          echo "--- /usr/local/nugis/nugis.log ---"
          sudo cat /usr/local/nugis/nugis.log || true

      - name: Carica tarball + .pkg come artifact
        uses: actions/upload-artifact@v4
        with:
          name: nugis-macos-universal
          path: |
            apps/server/installer-output-macos/nugis-macos-universal.tar.gz
            apps/server/installer-output-macos/NugisInstaller.pkg
          retention-days: 30
