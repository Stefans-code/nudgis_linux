name: Build & test Linux installer (universale x64+arm64)

on:
  workflow_dispatch: {}
  push:
    branches: [main]
    paths:
      - "apps/server/**"
      - "apps/web/**"
      - ".github/workflows/build-linux-installer.yml"

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Registra QEMU (serve solo a pkg per FABBRICARE il binario arm64 su questo runner x64)
        uses: docker/setup-qemu-action@v3

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Installa dipendenze (intero workspace)
        run: npm ci

      - name: Genera client Prisma (tutti i binaryTargets, vedi schema.prisma)
        run: npx prisma generate
        working-directory: apps/server

      - name: Build installer Linux universale (x64 + arm64 in un solo pacchetto)
        run: npm run build:installer:linux -w apps/server
        env:
          SKIP_OBFUSCATE: "1" # build CI di verifica: l'offuscamento non cambia se il binario parte o no, solo la velocità

      - name: Verifica che entrambi i binari siano presenti e del tipo giusto
        run: |
          cd apps/server/installer-output-linux/nugis-linux-universal
          file Nugis-x64 | tee /tmp/file-x64.txt | grep -q "x86-64"
          file Nugis-arm64 | tee /tmp/file-arm64.txt | grep -q "ARM aarch64"

      - name: Carica il pacchetto come artifact (lo scaricano i job di test)
        uses: actions/upload-artifact@v4
        with:
          name: nugis-linux-universal
          path: apps/server/installer-output-linux/nugis-linux-universal.tar.gz
          retention-days: 30

  # Esecuzione reale su runner NATIVI (non emulati) per ciascuna arch — l'esecuzione di
  # un binario arm64 sotto QEMU "nudo" (fuori da Docker, dove il binfmt di
  # docker/setup-qemu-action è pensato per girare) si è dimostrata inaffidabile in
  # pratica (13/09/2026: il processo non produceva output né errore, si bloccava e
  # basta) — un runner arm64 vero (ubuntu-24.04-arm, disponibile gratis su GitHub
  # Actions) evita il problema alla radice invece di provare a renderlo affidabile.
  test:
    needs: build
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            arch: x64
          - os: ubuntu-24.04-arm
            arch: arm64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: nugis-linux-universal

      - name: Test reale (${{ matrix.arch }}, runner nativo) — installa via install.sh e interroga /health
        run: |
          set -euo pipefail
          tar -xzf nugis-linux-universal.tar.gz
          cd nugis-linux-universal
          sudo NUGIS_ADMIN_EMAIL=ci@nugis.test NUGIS_ADMIN_PASSWORD='ci-test-password-123' ./install.sh
          for i in $(seq 1 15); do
            if curl -fsS http://localhost:4000/health; then echo; break; fi
            echo "in attesa del servizio... ($i/15)"; sleep 2
          done
          curl -fsS http://localhost:4000/health | grep -q '"ok":true'
          echo "✅ /health risponde correttamente (arch nativa ${{ matrix.arch }}, via systemd)"
          sudo systemctl status nugis --no-pager
          sudo /opt/nugis/uninstall.sh --purge
          echo "✅ Disinstallazione completata senza errori"

      - name: Diagnostica in caso di fallimento (log del servizio)
        if: failure()
        run: sudo journalctl -u nugis --no-pager -e || true
