name: Build & test Linux installer (universale x64+arm64)

on:
  workflow_dispatch: {}
  push:
    branches: [main]
    paths:
      - "apps/server/**"
      - "apps/web/**"
      - ".github/workflows/build-linux-installer.yml"

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Registra QEMU (permette a pkg di fabbricare E di eseguire il binario arm64 su questo runner x64)
        uses: docker/setup-qemu-action@v3

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Installa dipendenze (intero workspace)
        run: npm ci

      - name: Genera client Prisma (tutti i binaryTargets, vedi schema.prisma)
        run: npx prisma generate
        working-directory: apps/server

      - name: Build installer Linux universale (x64 + arm64 in un solo pacchetto)
        run: npm run build:installer:linux -w apps/server
        env:
          SKIP_OBFUSCATE: "1" # build CI di verifica: l'offuscamento non cambia se il binario parte o no, solo la velocità

      - name: Verifica che entrambi i binari siano presenti e del tipo giusto
        run: |
          cd apps/server/installer-output-linux/nugis-linux-universal
          file Nugis-x64 | tee /tmp/file-x64.txt | grep -q "x86-64"
          file Nugis-arm64 | tee /tmp/file-arm64.txt | grep -q "ARM aarch64"

      - name: Test reale (nativo x64) — installa via install.sh e interroga /health
        run: |
          set -euo pipefail
          cd apps/server/installer-output-linux/nugis-linux-universal
          sudo NUGIS_ADMIN_EMAIL=ci@nugis.test NUGIS_ADMIN_PASSWORD='ci-test-password-123' ./install.sh
          for i in $(seq 1 15); do
            if curl -fsS http://localhost:4000/health; then echo; break; fi
            echo "in attesa del servizio... ($i/15)"; sleep 2
          done
          curl -fsS http://localhost:4000/health | grep -q '"ok":true'
          echo "✅ /health risponde correttamente (arch nativa x64, via systemd)"
          sudo systemctl status nugis --no-pager
          sudo /opt/nugis/uninstall.sh --purge
          echo "✅ Disinstallazione completata senza errori"

      - name: Test reale del binario arm64 (emulato via QEMU, indipendente da install.sh)
        run: |
          set -euo pipefail
          B="apps/server/installer-output-linux/nugis-linux-universal"
          T=/tmp/nugis-arm64-test
          mkdir -p "$T"
          cp "$B/Nugis-arm64" "$T/Nugis"
          cp -r "$B/generated" "$B/prisma" "$B/public" "$T/"
          chmod +x "$T/Nugis"
          cat > "$T/.env" <<EOF
          DATABASE_URL="file:$T/nugis.db"
          ENCRYPTION_KEY="$(openssl rand -base64 48)"
          LLM_PROVIDER="ollama"
          ADMIN_JWT_SECRET="$(openssl rand -base64 48)"
          ADMIN_DEFAULT_EMAIL="ci@nugis.test"
          ADMIN_DEFAULT_PASSWORD="ci-test-password-123"
          PORT=4001
          WEB_ORIGIN="http://localhost:4001"
          EOF
          cd "$T"
          ./Nugis > nugis-arm64.log 2>&1 &
          PID=$!
          ok=0
          for i in $(seq 1 20); do
            if curl -fsS http://localhost:4001/health; then ok=1; echo; break; fi
            echo "in attesa del binario arm64 emulato... ($i/20)"; sleep 3
          done
          if [ "$ok" != "1" ]; then
            echo "--- log del binario arm64 ---"; cat nugis-arm64.log
            kill "$PID" 2>/dev/null || true
            exit 1
          fi
          curl -fsS http://localhost:4001/health | grep -q '"ok":true'
          echo "✅ Il binario arm64 (via QEMU) risponde correttamente — motore Prisma corretto incluso"
          kill "$PID" 2>/dev/null || true

      - name: Diagnostica in caso di fallimento (log del servizio)
        if: failure()
        run: sudo journalctl -u nugis --no-pager -e || true

      - name: Carica il pacchetto come artifact
        uses: actions/upload-artifact@v4
        with:
          name: nugis-linux-universal
          path: apps/server/installer-output-linux/nugis-linux-universal.tar.gz
          retention-days: 30
