server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Proxy delle chiamate API verso il container server: il browser parla SOLO con
    # questa origine (evita configurazioni CORS lato cliente).
    location /auth/ {
        proxy_pass http://server:4000/auth/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    location /admin/ {
        proxy_pass http://server:4000/admin/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    location /health {
        proxy_pass http://server:4000/health;
    }

    # SPA: qualunque altra rotta serve index.html, il routing lo fa React Router.
    location / {
        try_files $uri /index.html;
    }
}
